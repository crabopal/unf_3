<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN"><html><head><style>
/* Базовые CSS-переменные шаблона: размеры зон, размеры шрифта и фирменные цвета. */
:root {
    --header-height: 14%;
    --footer-height: 14%;
    --font-size-base: 30px;
    --font-size-large: 200%;
    --font-size-medium: 150%;
    --font-size-small: 100%;
    --color: #000000;
    --color-swapped: #000000;
    --bg-header: var(--color);
    --bg-main: #FFFFFF;
    --bg-footer: var(--color);
    --bg-button: var(--color);
    --text-color: black;
}

/* Единая модель расчета размеров для всех элементов, чтобы padding и border не ломали верстку. */
* {
    box-sizing: border-box;
}

/* Общие настройки страницы: семейство шрифтов, отсутствие внешних отступов и базовый размер текста. */
body {
    font-family: "Helvetica Neue", Helvetica, sans-serif;
    margin: 0;
    font-size: var(--font-size-base);
    color: var(--color-swapped);
}

/* Базовое поведение изображений: вписывание в контейнер без искажения пропорций. */
img {
    max-width: 100%;
    height: auto;
    width: auto;
    vertical-align: top;
    text-align: center;
}

/* Корневой контейнер, растянутый на всю площадь дисплея покупателя. */
.layout-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}

/* Основная рабочая область с контентом без рекламной зоны. */
.content-panel {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
}

/* Контейнер рекламной области. */
.ad-panel {
    position: absolute;
    overflow: hidden;
}

/* Центрирование рекламного изображения внутри выделенной зоны. */
.ad-panel img {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    max-width: 100%;
    max-height: 100%;
}


/* Верхняя информационная плашка с заголовком или названием операции. */
.header {
    position: absolute;
    left: 0;
    width: 100%;
    top: 0;
    padding: 0.5% 0;
    text-align: center;
    background: var(--bg-header);
    max-height: var(--header-height);
    font-size: var(--font-size-medium);
    color: white;
}

/* Нижняя информационная плашка для статуса или текущей операции. */
.footer {
    position: absolute;
    left: 0;
    width: 100%;
    bottom: 0;
    padding: 0.5% 0;
    text-align: center;
    background: var(--bg-footer);
    max-height: var(--footer-height);
    font-size: var(--font-size-medium);
    color: white;
}

/* Центральная область шаблона между верхним и нижним блоками. */
.main {
    position: absolute;
    left: 0;
    width: 100%;
    width: 100%;
    top: var(--header-height);
    text-align: center;
    background: var(--bg-main);
}


</style></head><body>

</body></html>
